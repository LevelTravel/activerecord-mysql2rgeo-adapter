name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test_results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Test Results
    needs: [test-ubuntu-ruby]
    steps:
      - run: '[[ "${{ needs.test-ubuntu-ruby.result }}" == "success" ]]'

  test-ubuntu-ruby:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: mysql2rgeo_adapter_test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      AR_VERSION: v${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0", "3.4.10", "3.3", "3.2"]
        mysql: ["8.4"]
        rails: ["8.1.3.1"]
        include:
          # Exercise MySQL 8.0 on LevelTravel's Ruby across every supported
          # Rails line; use MySQL 8.4 for the broader Ruby compatibility sweep.
          - ruby: "3.4.10"
            mysql: "8.0"
            rails: "8.1.3.1"
          - ruby: "3.4.10"
            mysql: "8.0"
            rails: "7.2.3.2"
          - ruby: "3.4.10"
            mysql: "8.4"
            rails: "7.2.3.2"
          - ruby: "3.4.10"
            mysql: "8.0"
            rails: "8.0.5.1"
          - ruby: "3.4.10"
            mysql: "8.4"
            rails: "8.0.5.1"
    steps:
      - name: Set Up Actions
        uses: actions/checkout@v6
      - name: Install GEOS
        run: sudo apt-get install libgeos-dev
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Create Database
        run: |
          mysql -uroot -h127.0.0.1 -ppassword -e 'CREATE DATABASE IF NOT EXISTS mysql2rgeo_adapter_test;'
          mysql -uroot -h127.0.0.1 -ppassword -e 'CREATE DATABASE IF NOT EXISTS mysql2rgeo_adapter_test2;'
          mysql -uroot -h127.0.0.1 -ppassword -e 'CREATE DATABASE IF NOT EXISTS mysql2rgeo_tasks_test;'
      - name: Run Tests
        run: bundle exec rake test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PASSWORD: password
          TESTOPTS: --profile=3
          TEST_TIMEOUT: 30
